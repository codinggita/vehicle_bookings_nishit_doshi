services:
  - type: web
    name: vehicle-bookings-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
        placeholder: "Enter your MongoDB connection string (e.g. mongodb+srv://...)"
      - key: JWT_EXPIRE
        value: 24h
      - key: JWT_SECRET
        generateValue: true
